<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>$EDOGE Mining</title>
<meta name="theme-color" content="#16112e">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#16112e;--ink2:#221a45;--paper:#fff6e0;--yellow:#ffc62e;--pink:#ff5c9d;--sky:#58d6ff;--mint:#5ef2b0;--line:3px solid #000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font:500 16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:18px 16px 24px}
h1,h2,h3,.d{font-family:'Arial Black',Impact,system-ui,sans-serif;font-weight:900;letter-spacing:-.01em;line-height:1.05}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hi{font-size:15px;opacity:.8}
.card{background:var(--paper);color:#000;border:var(--line);border-radius:20px;padding:16px;box-shadow:5px 5px 0 #000;margin-bottom:16px}
.card.y{background:var(--yellow)} .card.p{background:var(--pink)} .card.s{background:var(--sky)} .card.m{background:var(--mint)}
.bal{text-align:center}
.bal small{display:block;font-weight:700;opacity:.75}
.bal .n{font:900 52px/1 'Arial Black',Impact,sans-serif;margin:4px 0}
.dogwrap{display:grid;place-items:center;margin:6px 0 10px}
.dog{width:190px;height:190px;border-radius:50%;background:var(--yellow);border:var(--line);box-shadow:6px 6px 0 #000;display:grid;place-items:center;font-size:96px;cursor:pointer;user-select:none;transition:transform .1s}
.dog:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.dog.off{filter:grayscale(.7);opacity:.7}
.btn{display:block;width:100%;font:800 17px system-ui,sans-serif;color:#000;background:var(--yellow);border:var(--line);border-radius:999px;padding:13px 18px;box-shadow:4px 4px 0 #000;cursor:pointer;text-align:center;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.pink{background:var(--pink)} .btn.sky{background:var(--sky)} .btn.paper{background:var(--paper)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--ink2);border:2px solid rgba(255,246,224,.2);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font:900 24px 'Arial Black',sans-serif}
.stat span{font-size:13px;opacity:.75}
h2{font-size:26px;margin-bottom:12px}
.task{display:flex;align-items:center;gap:12px;background:var(--ink2);border:2px solid rgba(255,246,224,.2);border-radius:16px;padding:12px;margin-bottom:10px}
.task .ic{font-size:28px}
.task .t{flex:1} .task .t b{display:block} .task .t small{opacity:.7}
.task .btn{width:auto;padding:8px 14px;font-size:14px}
.note{font-size:13px;opacity:.7;margin-top:8px}
input{width:100%;font:600 16px ui-monospace,Menlo,monospace;padding:13px 14px;border-radius:14px;border:var(--line);background:#fff;color:#000;margin:10px 0}
nav{display:flex;background:var(--ink2);border-top:3px solid #000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--paper);padding:10px 2px 9px;font:700 11px system-ui,sans-serif;opacity:.6;cursor:pointer}
nav button .e{display:block;font-size:22px;margin-bottom:2px}
nav button.on{opacity:1;color:var(--yellow)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%)}
.tab{display:none} .tab.on{display:block}
.ptr{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:34px;line-height:1;z-index:2;color:#000;text-shadow:0 2px 0 #fff6e0}
canvas{display:block;touch-action:none;max-width:100%}
#gc{width:100%;height:auto;border:var(--line);border-radius:18px;background:#221a45;margin:10px 0}
.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.18)}}
.loading{height:100%;display:grid;place-items:center;font-size:44px}
.qbub{background:#fff;color:#000;border:var(--line);border-radius:18px;padding:14px;font-weight:700;margin:10px 0;box-shadow:4px 4px 0 #000;word-break:break-word}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.red{background:#ff6b6b}.btn.green{background:var(--mint)}
.ccard{border:var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 #000;color:#000}
.ccard .big{font-size:46px;line-height:1}
.ccard .bonus{font:900 22px 'Arial Black',sans-serif}
.pillx{display:inline-block;background:#000;color:#fff6e0;border-radius:999px;font:800 11px system-ui;padding:3px 10px;letter-spacing:.05em}
.lbrow{color:var(--paper);display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--ink2);margin-bottom:6px}
.lbrow.me{outline:3px solid var(--yellow)}
.lbrow b.r{width:28px;text-align:center}
.lbrow span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:6px;margin:8px 0 10px}.seg button{flex:1;font:800 13px system-ui;padding:9px 4px;border-radius:12px;border:2px solid rgba(0,0,0,.35);background:none;color:#000}.seg button.on{background:var(--yellow);color:#000;border-color:#000}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<div id="app">
  <main id="main"><div class="loading">🐕</div></main>
  <nav id="nav" hidden>
    <button data-t="mine" class="on"><span class="e">⛏️</span>Mine</button>
    <button data-t="tasks"><span class="e">✅</span>Tasks</button>
    <button data-t="games"><span class="e">🎮</span>Games</button>
    <button data-t="cards"><span class="e">🃏</span>Cards</button>
    <button data-t="friends"><span class="e">👥</span>Friends</button>
    <button data-t="me"><span class="e">👤</span>Profile</button>
  </nav>
</div>
<div id="toast"></div>

<script type="module">
/* ============ SETTINGS (edit here) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAt5L0m5icdq_YcvDnLm9ubd3_m3TtPS44",
  authDomain: "extra-doge-coin.firebaseapp.com",
  databaseURL: "https://extra-doge-coin-default-rtdb.firebaseio.com",
  projectId: "extra-doge-coin",
  storageBucket: "extra-doge-coin.firebasestorage.app",
  messagingSenderId: "431394704160",
  appId: "1:431394704160:web:1e899c8e6d4dcf891aa545"
};
/* ---- paste your links here (a task shows up only when its link is filled in) ---- */
const TELEGRAM_CHANNEL_LINK = "https://t.me/extradoge_coin";
const X_ACCOUNT_LINK        = "";
const YOUTUBE_LINK          = "https://youtube.com/@extradogecoin";
const WEBSITE_LINK          = "https://www.extradogecoin.xyz";

const BOT_USERNAME = "Extradogebot";
/* Invite link base. Use ONE of these, whichever opens the Mini App directly:
   "https://t.me/Extradogebot?startapp="        (Main Mini App)
   "https://t.me/Extradogebot/app?startapp="    (Mini App with short name "app") */
const INVITE_LINK_BASE = "https://t.me/Extradogebot?startapp=";
const APP_SHORT_NAME = "app";                 // t.me/Extradogebot/app
const BASE_REWARD = 5;                        // coins per daily claim
const PER_INVITE_BONUS = 0.5;                 // extra coins per claim for every invited friend
const MAX_INVITES_COUNTED = 50;
const WELCOME_BONUS = 5;
const COOLDOWN_MS = 24*60*60*1000;
const TASK_REWARD = 5;                        // coins per task, one time each
const TASKS = [
  {id:"tg",  icon:"✈️", title:"Join our Telegram channel", reward:TASK_REWARD, url:TELEGRAM_CHANNEL_LINK},
  {id:"x",   icon:"𝕏",  title:"Follow us on X",            reward:TASK_REWARD, url:X_ACCOUNT_LINK},
  {id:"yt",  icon:"▶️", title:"Subscribe on YouTube",      reward:TASK_REWARD, url:YOUTUBE_LINK},
  {id:"web", icon:"🌐", title:"Visit our website",         reward:TASK_REWARD, url:WEBSITE_LINK}
];
/* =============================================== */

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const qs = new URLSearchParams(location.search);
const myTgId = String(tgUser ? tgUser.id : (qs.get("uid") || "demo"));
const myName = tgUser ? (tgUser.first_name || "Friend") : "Friend";
const myUname = String((tgUser&&tgUser.username)||"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,40);
const startSrc=[];
function readStart(){
  let v="";
  try{v=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"";if(v)startSrc.push("unsafe")}catch(e){}
  if(!v){try{v=new URLSearchParams((tg&&tg.initData)||"").get("start_param")||"";if(v)startSrc.push("initData")}catch(e){}}
  if(!v){try{v=new URLSearchParams(location.hash.slice(1)).get("tgWebAppStartParam")||"";if(v)startSrc.push("hash")}catch(e){}}
  if(!v){try{v=qs.get("tgWebAppStartParam")||qs.get("startapp")||qs.get("ref")||"";if(v)startSrc.push("query")}catch(e){}}
  return v;
}
const startParam = String(readStart()).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round1 = n => Math.round(n*10)/10;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
function buzz(){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred("success")}catch(e){}}

/* ---------- storage: Firebase if configured, otherwise this device only ---------- */
let store, mode;
async function makeStore(){
  if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) {
    try {
      const V="10.14.1", B=`https://www.gstatic.com/firebasejs/${V}/`;
      const {initializeApp}=await import(B+"firebase-app.js");
      const {getAuth,signInAnonymously}=await import(B+"firebase-auth.js");
      const FS=await import(B+"firebase-firestore.js");
      const {getFirestore,doc,getDoc,setDoc,updateDoc,collection,query,where,getDocs}=FS;
      // One Firebase app (and therefore one saved login) per Telegram account, so several accounts on one phone never overwrite each other.
      const app=initializeApp(FIREBASE_CONFIG,"tg"+myTgId), auth=getAuth(app), db=getFirestore(app);
      await auth.authStateReady();
      if(!auth.currentUser) await signInAnonymously(auth);
      const uid=auth.currentUser.uid;
      const uref=doc(db,"users",uid);
      mode="cloud";
      return {
        kit(){return {db,F:FS}},
        async lbPut(name,coins){await setDoc(doc(db,"lb",uid),{name,coins,at:Date.now()})},
        async lbwPut(wk,name,v){await setDoc(doc(db,"lbw",String(wk),"u",uid),{name,catcher:v.catcher,scam:v.scam})},
        async lbwGet(wk){const s=await getDoc(doc(db,"lbw",String(wk),"u",uid));return s.exists()?s.data():null},
        async lbTop(kind,wk){
          const q=kind==="coins"?query(collection(db,"lb"),FS.orderBy("coins","desc"),FS.limit(10)):query(collection(db,"lbw",String(wk),"u"),FS.orderBy(kind,"desc"),FS.limit(10));
          const s=await getDocs(q);return s.docs.map(d=>Object.assign({id:d.id},d.data()))},
        uid,
        async load(){const s=await getDoc(uref);return s.exists()?s.data():null},
        async create(d){await setDoc(uref,d)},
        async patch(p){await updateDoc(uref,p)},
        async addRef(referrer){await setDoc(doc(db,"refs",uid),{referrer:String(referrer),child:uid,at:Date.now()})},
        async refCount(){const s=await getDocs(query(collection(db,"refs"),where("referrer","==",myTgId)));return s.size},
        async getConfig(){const s=await getDoc(doc(db,"config","app"));return s.exists()?s.data():null},
        async getTasks(u){const s=await getDocs(query(collection(db,"tasks"),where("active","==",true),where("forUsername","in",["",u||"-"])));return s.docs.map(d=>Object.assign({id:d.id},d.data()))}
      };
    } catch(e){ console.error("Firebase failed, using local mode", e); }
  }
  mode="local";
  const K="edoge_mining_v1_"+myTgId;
  const get=()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}};
  const put=d=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}};
  let mem=get();
  return {
    kit(){return null},
    async lbPut(){}, async lbwPut(){}, async lbwGet(){return null}, async lbTop(){return []}, uid:"local",
    async load(){return mem},
    async create(d){mem=d;put(mem)},
    async patch(p){mem=Object.assign({},mem,p);put(mem)},
    async addRef(){},
    async refCount(){return 0},
    async getConfig(){return null},
    async getTasks(){return []}
  };
}

/* ---------- state ---------- */
let S=null, refs=0, tick=null;
const dbg={ref:"-",cnt:"-"};
const CFG={miningOn:true,baseReward:BASE_REWARD,perInviteBonus:PER_INVITE_BONUS,cooldownMs:COOLDOWN_MS,message:""};
let CUSTOM=[];
const rewardNow = () => round1(CFG.baseReward + Math.min(refs,MAX_INVITES_COUNTED)*CFG.perInviteBonus + cardBonus(S));
const nextAt = () => (S.lastClaim||0)+CFG.cooldownMs;
const canClaim = () => CFG.miningOn && Date.now() >= nextAt();
const SPIN_PER_DAY=3, GAME_PER_DAY=3, GAME_MAX=55;        // per-day limits (also enforced by the Firestore rules)
const PRIZES=[{v:0.5,w:30},{v:1,w:28},{v:2,w:20},{v:3,w:12},{v:5,w:7},{v:10,w:3}];   // spin wheel: value and chance (%)
const dayNum=()=>Math.floor(Date.now()/86400000);
const wkNum=()=>Math.floor(Date.now()/604800000);
const SCAM_PER_DAY=3, SCAM_MAX=7;
const scamPlaysLeft=()=>Math.max(0,SCAM_PER_DAY-(S.scamDay===dayNum()?(S.scamPlays||0):0));
/* Cards: bought with app coins (not tokens). Prices and boosts are also enforced by the Firestore rules. */
const CARDS=[
 {id:"bronze", icon:"🐶", name:"Bronze Pup",    price:50,   boost:.5, bg:"#ff9f43", nft:false},
 {id:"silver", icon:"🐕", name:"Silver Shiba",  price:200,  boost:2,  bg:"#d9e2ec", nft:false},
 {id:"gold",   icon:"🦮", name:"Golden Doge",   price:600,  boost:7,  bg:"#ffc62e", nft:true},
 {id:"diamond",icon:"💎", name:"Diamond Alpha", price:2000, boost:25, bg:"#58d6ff", nft:true}
];
const cardBonus=s=>round1(CARDS.reduce((a,c)=>a+((s&&s.cards&&s.cards[c.id])?c.boost:0),0));
const spinsLeft=()=>Math.max(0,SPIN_PER_DAY-(S.spinDay===dayNum()?(S.spinsUsed||0):0));
const playsLeft=()=>Math.max(0,GAME_PER_DAY-(S.gameDay===dayNum()?(S.gamePlays||0):0));
let scamRun=false, SQ=null, W={wk:0,catcher:0,scam:0}, lbTab="coins", lbTimer=null;
let gameRun=false, spinning=false, pendingRender=false, wheelAngle=0, G=null, gx=170;
const allTasks = () => TASKS.filter(t=>t.url).concat(CUSTOM);
async function loadCfg(){
  try{const c=await store.getConfig(); if(!c) return;
    const n=(v,d,lo,hi)=>{v=Number(v);return isFinite(v)&&v>=lo&&v<=hi?v:d};
    CFG.miningOn=c.miningOn!==false;
    CFG.baseReward=n(c.baseReward,BASE_REWARD,0,1000);
    CFG.perInviteBonus=n(c.perInviteBonus,PER_INVITE_BONUS,0,100);
    CFG.cooldownMs=n(c.cooldownMs,COOLDOWN_MS,3600000,30*86400000);
    CFG.message=String(c.message||"").slice(0,200);
  }catch(e){console.warn("config",e)}
}
async function refreshS(){try{const cur=await store.load(); if(cur) S=Object.assign(S,cur)}catch(e){}}
const inviteLink = () => INVITE_LINK_BASE + myTgId;
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));const h=String(Math.floor(s/3600)).padStart(2,"0"),m=String(Math.floor(s%3600/60)).padStart(2,"0"),x=String(s%60).padStart(2,"0");return `${h}:${m}:${x}`}

/* ---------- views ---------- */
function render(){
  if(gameRun||spinning||scamRun){pendingRender=true;return}
  const tasks=allTasks();
  $("#main").innerHTML=`
  <section class="tab on" id="t-mine">
    <div class="top"><div><div class="hi">Hi, ${esc(myName)} 👋</div><h1 style="font-size:24px">$EDOGE Mining</h1></div></div>
    ${CFG.message?`<div class="card s" style="padding:12px"><b>📢 ${esc(CFG.message)}</b></div>`:""}
    <div class="card y bal"><small>Your coins</small><div class="n" id="bal">${S.coins}</div><small>Points collected in the app. Not tokens yet.</small></div>
    <div class="dogwrap"><div class="dog" id="dog" role="button" aria-label="Claim">🐕</div></div>
    <button class="btn" id="claim"></button>
    <p class="note" style="text-align:center" id="rate"></p>
    <div class="grid2" style="margin-top:16px">
      <div class="stat"><b id="s-ref">${refs}</b><span>Friends invited</span></div>
      <div class="stat"><b id="s-rate">+${rewardNow()}</b><span>Coins per claim</span></div>
    </div>
  </section>

  <section class="tab" id="t-tasks">
    <h2>Tasks</h2>
    ${tasks.map(t=>{const done=S.tasks&&S.tasks[t.id];return `
      <div class="task"><div class="ic">${t.icon}</div><div class="t"><b>${esc(t.title)}</b><small>+${t.reward} coins</small></div>
      ${done?`<span>✅</span>`:`<button class="btn sky" data-task="${t.id}">Go</button>`}</div>`}).join("")||'<p class="note">New tasks are coming soon.</p>'}
    <p class="note">Open the link, wait a few seconds, then tap Claim.</p>
  </section>

  <section class="tab" id="t-games">
    <h2>Games</h2>
    <div class="card y">
      <div class="row"><b style="font-size:20px">🎡 Lucky Spin</b><span><b id="spinsLeft">${spinsLeft()}</b>/${SPIN_PER_DAY} spins left</span></div>
      <div style="position:relative;width:260px;margin:22px auto 12px"><div class="ptr">▼</div><canvas id="wheel" width="520" height="520" style="width:260px;height:260px"></canvas></div>
      <button class="btn" id="spin">Spin the wheel</button>
      <p class="note" style="color:#000;opacity:.75">Win 0.5 to 10 coins. ${SPIN_PER_DAY} spins every day, resets at 00:00 UTC.</p>
    </div>
    <div class="card s">
      <div class="row"><b style="font-size:20px">🐕 EDOGE Catcher</b><span><b id="playsLeft">${playsLeft()}</b>/${GAME_PER_DAY} plays left</span></div>
      <canvas id="gc" width="340" height="460"></canvas>
      <button class="btn pink" id="gstart">Play</button>
      <p class="note" style="color:#000;opacity:.8">Drag to move the dog and catch the coins. A 💣 ends your round, but you keep the coins you caught. Survive 60 seconds and a BIG EDOGE coin (15 or 20 coins) drops. It gets faster the longer you last. Very hard! ${GAME_PER_DAY} plays every day.</p>
    </div>
    <div class="card p" id="scamcard">
      <div class="row"><b style="font-size:20px">🕵️ Spot the Scam</b><span><b id="scamLeft">${scamPlaysLeft()}</b>/${SCAM_PER_DAY} plays left</span></div>
      <div id="scamarea">${scamIdle()}</div>
    </div>
    <div class="card" id="lbcard">
      <b style="font-size:20px">🏆 Leaderboard</b>
      <div class="seg" id="lbseg"><button data-k="coins" class="${lbTab==="coins"?"on":""}">Top coins</button><button data-k="catcher" class="${lbTab==="catcher"?"on":""}">Catcher (week)</button><button data-k="scam" class="${lbTab==="scam"?"on":""}">Scam (week)</button></div>
      <div id="lblist"><p class="note">Loading...</p></div>
      <p class="note" style="color:#000">Shows Telegram first names. Weekly boards reset every Monday 00:00 UTC.</p>
    </div>
    <p class="note">Game and spin coins are app points. More games are planned.</p>
  </section>

  <section class="tab" id="t-cards">
    <h2>Cards</h2>
    <div class="card y"><p><b>Buy cards with your app coins to boost every daily claim.</b></p>
      <p class="note" style="color:#000;opacity:.75">Each card can be bought once. Your boost now: <b>+${cardBonus(S)}</b> coins per claim.</p></div>
    ${CARDS.map(c=>{const own=S.cards&&S.cards[c.id];return `<div class="ccard" style="background:${c.bg}">
      <div class="row"><div class="big">${c.icon}</div><div style="flex:1;padding-left:8px"><b style="font-size:19px">${c.name}</b><div class="bonus">+${c.boost} per claim</div></div>${c.nft?'<span class="pillx">NFT planned</span>':''}</div>
      ${own?'<button class="btn paper" disabled style="margin-top:10px">✅ Owned</button>':`<button class="btn" data-buy="${c.id}" style="margin-top:10px">Buy for ${c.price} coins</button>`}</div>`}).join("")}
    <p class="note">Cards are in-app items bought with app points, not tokens. NFT versions of some cards are only planned: there is no date, no guarantee they will happen, and no promise of any value. Not financial advice.</p>
  </section>

  <section class="tab" id="t-friends">
    <h2>Invite friends</h2>

/* ---------- Lucky Spin ---------- */
function drawWheel(a){
  const c=$("#wheel"); if(!c) return; const x=c.getContext("2d"), R=260, n=PRIZES.length, seg=Math.PI*2/n;
  const cols=["#ffc62e","#ff5c9d","#58d6ff","#5ef2b0","#fff6e0","#ff9f43"];
  x.clearRect(0,0,520,520); x.save(); x.translate(R,R); x.rotate(a);
  for(let i=0;i<n;i++){
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,R-8,i*seg,(i+1)*seg); x.closePath();
    x.fillStyle=cols[i%cols.length]; x.fill(); x.lineWidth=6; x.strokeStyle="#000"; x.stroke();
    x.save(); x.rotate((i+.5)*seg); x.fillStyle="#000"; x.font="900 46px Arial Black,Arial,sans-serif"; x.textAlign="right"; x.fillText("+"+PRIZES[i].v,R-42,16); x.restore();
  }
  x.beginPath(); x.arc(0,0,36,0,Math.PI*2); x.fillStyle="#000"; x.fill(); x.restore();
}
async function doSpin(){
  if(spinning||gameRun||scamRun) return;
  await refreshS();
  if(spinsLeft()<=0) return toast("No spins left today. Come back tomorrow!");
  let r=Math.random()*PRIZES.reduce((a,p)=>a+p.w,0), idx=0;
  for(let i=0;i<PRIZES.length;i++){r-=PRIZES[i].w; if(r<=0){idx=i;break}}
  const prize=PRIZES[idx], day=dayNum(), used=(S.spinDay===day?(S.spinsUsed||0):0)+1, coins=round1((S.coins||0)+prize.v);
  try{await store.patch({coins,spinDay:day,spinsUsed:used})}catch(e){console.error(e);return toast("Could not save. Check your internet.")}
  S.coins=coins; S.spinDay=day; S.spinsUsed=used; spinning=true;
  const b=$("#spin"); if(b) b.disabled=true;
  const seg=Math.PI*2/PRIZES.length, jitter=(Math.random()-.5)*seg*.6;
  const target=-Math.PI/2-(idx+.5)*seg+jitter, a0=wheelAngle;
  const delta=(((target-a0)%(Math.PI*2))+Math.PI*2)%(Math.PI*2), total=Math.PI*2*5+delta, T=4000, t0=performance.now();
  await new Promise(res=>{(function f(now){
    const p=Math.min(1,(now-t0)/T), e=1-Math.pow(1-p,3);
    wheelAngle=a0+total*e; drawWheel(wheelAngle);
    if(p<1) requestAnimationFrame(f); else res();
  })(t0)});
  wheelAngle=((wheelAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  spinning=false; setCoins();
  const l=$("#spinsLeft"); if(l) l.textContent=spinsLeft();
  const bb=$("#spin"); if(bb) bb.disabled=spinsLeft()<=0;
  buzz(); toast("🎉 +"+prize.v+" coins!");
  if(pendingRender){pendingRender=false;render();switchTab("games")}
}

const GW=340, GH=460, DOGE_Y=GH-54;

let inputOn=null;

async function startGame(){
  if(gameRun||spinning||scamRun) return;
  await refreshS();
  if(playsLeft()<=0) return toast("No plays left today. Come back tomorrow!");
  const day=dayNum(), same=S.gameDay===day;
  const patch={gameDay:day,gamePlays:(same?(S.gamePlays||0):0)+1,gameCoins:same?(S.gameCoins||0):0};
  try{await store.patch(patch)}catch(e){console.error(e);return toast("Could not start. Check your internet.")}
  Object.assign(S,patch);
  const pl=$("#playsLeft"); if(pl) pl.textContent=playsLeft();
  const b=$("#gstart"); if(b) b.disabled=true;
  try{tg&&tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
  gx=GW/2; gameRun=true;
  G={t:0,score:0,items:[],nextCoin:.6,nextBomb:1.4,big:false,over:false,why:"",last:performance.now()};
  requestAnimationFrame(gameFrame);
}
const KINDS=[{v:.5,sp:.8,r:13,c:"#fff6e0",w:50},{v:1,sp:1,r:15,c:"#ffc62e",w:35},{v:2,sp:1.4,r:17,c:"#ff9f43",w:15}];
function gameFrame(now){
  if(!G) return;
  const dt=Math.min(.05,(now-G.last)/1000); G.last=now; G.t+=dt;
  const base=210+G.t*5.4;                                   // fall speed keeps rising, no levels
  // spawn: 5 coins every 10 seconds (one every ~2s), stops once the big coin is out
  if(G.t<60 && G.t>=G.nextCoin){
    let r=Math.random()*100,k=KINDS[0]; for(const q of KINDS){r-=q.w;if(r<=0){k=q;break}}
    G.items.push({type:"coin",v:k.v,r:k.r,c:k.c,x:24+Math.random()*(GW-48),y:-20,sp:k.sp});
    G.nextCoin=G.t+2*(.85+Math.random()*.3);
  }
  if(G.t>=G.nextBomb){
    G.items.push({type:"bomb",r:15,x:20+Math.random()*(GW-40),y:-20,sp:1.05});
    G.nextBomb=G.t+Math.max(.55,1.6-G.t*.0175)*(.8+Math.random()*.4);
  }
  if(G.t>=60 && !G.big){G.big=true;G.items.push({type:"big",v:Math.random()<.5?15:20,r:30,x:50+Math.random()*(GW-100),y:-40,sp:1.9})}
  let ended=false;
  for(const it of G.items){
    it.y+=base*it.sp*dt;
    if(!it.dead && Math.abs(it.y-DOGE_Y)<it.r+20 && Math.abs(it.x-gx)<it.r+26){
      it.dead=true;
      if(it.type==="bomb"){G.over=true;G.why="bomb";ended=true}
      else{G.score=round1(G.score+it.v); if(it.type==="big"){G.over=true;G.why="big";ended=true}}
    } else if(it.y>GH+50){ if(it.type==="big"){G.over=true;G.why="bigmiss";ended=true} it.dead=true; }
  }
  G.items=G.items.filter(i=>!i.dead);
  drawGame();
  if(ended||G.over) return endGame();
  requestAnimationFrame(gameFrame);
}
function drawGame(){
  const x=gctx(); if(!x||!G) return;
  x.clearRect(0,0,GW,GH); x.fillStyle="#221a45"; x.fillRect(0,0,GW,GH);
  x.textAlign="center"; x.textBaseline="middle";
  for(const it of G.items){
    if(it.type==="bomb"){x.font="30px serif";x.fillText("💣",it.x,it.y);continue}
    x.beginPath(); x.arc(it.x,it.y,it.r,0,Math.PI*2); x.fillStyle=it.type==="big"?"#ff5c9d":it.c; x.fill(); x.lineWidth=3; x.strokeStyle="#000"; x.stroke();
    x.fillStyle="#000"; x.font=it.type==="big"?"900 16px Arial Black,Arial":"900 12px Arial Black,Arial"; x.fillText(it.type==="big"?"EDOGE":String(it.v),it.x,it.y-(it.type==="big"?7:0));
    if(it.type==="big"){x.font="900 17px Arial Black,Arial";x.fillText(String(it.v),it.x,it.y+11)}
  }
  x.font="46px serif"; x.fillText("🐕",gx,DOGE_Y+6);
  x.textAlign="left"; x.textBaseline="alphabetic"; x.fillStyle="#fff6e0"; x.font="900 18px Arial Black,Arial"; x.fillText("🪙 "+G.score,12,26);
  x.textAlign="right"; const ts=Math.min(60,Math.floor(G.t)); x.fillText("0:"+String(ts).padStart(2,"0"),GW-12,26);
}

function openUrl(u){try{if(tg&&u.startsWith("https://t.me")&&tg.openTelegramLink)tg.openTelegramLink(u);else if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank")}catch(e){window.open(u,"_blank")}}
async function taskClick(btn){
  const t=allTasks().find(x=>x.id===btn.dataset.task); if(!t) return;
  if(!pending[t.id]){pending[t.id]=Date.now();openUrl(t.url);btn.textContent="Claim";btn.classList.remove("sky");btn.classList.add("pink");return;}
  if(Date.now()-pending[t.id]<8000) return toast("Finish the task first, then tap Claim");
  await refreshS(); if(S.tasks&&S.tasks[t.id]){render();switchTab("tasks");return;}
  const tasks=Object.assign({},S.tasks||{},{[t.id]:true}), coins=round1((S.coins||0)+t.reward);
  try{await store.patch({tasks,coins});S.tasks=tasks;S.coins=coins;buzz();toast(`+${t.reward} coins`);render();switchTab("tasks")}
  catch(e){toast("Could not save. Check your internet.")}
}
async function applyCode(){
  const v=($("#code").value||"").trim().replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
  if(!v) return toast("Enter a code first");
  if(v===myTgId) return toast("You cannot use your own code");
  try{
    try{await store.addRef(v)}catch(e){console.warn("addRef (maybe already saved)",e)}
    await store.patch({referredBy:v});
    S.referredBy=v; dbg.ref="saved (typed code)"; buzz(); toast("Invite code applied");
  }catch(e){
    console.error(e); dbg.ref="error: "+(e&&e.code||e&&e.message||e);
    toast("Could not apply: "+(e&&e.code||"error"));
  }
  render(); switchTab("friends");
}
async function copyLink(){
  const l=inviteLink();
  try{await navigator.clipboard.writeText(l);toast("Link copied")}catch(e){const i=$("#link");i.select();try{document.execCommand("copy");toast("Link copied")}catch(_){toast("Press and hold the link to copy")}}
}
async function saveWallet(){
  const v=$("#wallet").value.trim();
  if(!/^0x[a-fA-F0-9]{40}$/.test(v)) return toast("Enter a valid address: 0x + 40 characters");
  try{await store.patch({wallet:v});S.wallet=v;buzz();toast("Wallet saved")}catch(e){toast("Could not save. Check your internet.")}
}
function switchTab(t){
  document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id==="t-"+t));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.t));

/* ---------- start ---------- */
(async()=>{
  try{
    store=await makeStore();
    S=await store.load();
    if(!S){
      const ref=(startParam&&startParam!==myTgId)?startParam:"";
      S={tgId:myTgId,name:myName,username:myUname,coins:WELCOME_BONUS,lastClaim:0,tasks:{},wallet:"",referredBy:ref,createdAt:Date.now()};
      await store.create(S);
      if(ref){try{await store.addRef(ref);dbg.ref="saved"}catch(e){console.warn("ref failed",e);dbg.ref="error: "+(e&&e.code||e&&e.message||e)}}
    }
    // Existing account that never used an invite, opened via someone's link within its first 7 days: apply it now.
    if(S && !S.referredBy && startParam && startParam!==myTgId && (Date.now()-(S.createdAt||0))<7*24*3600*1000){
      try{
        try{await store.addRef(startParam)}catch(e){console.warn("late addRef",e)}
        await store.patch({referredBy:startParam}); S.referredBy=startParam; dbg.ref="saved (late, from link)";
      }catch(e){dbg.ref="error (late): "+(e&&e.code||e&&e.message||e)}
    }
    try{refs=await store.refCount();dbg.cnt="ok, "+refs}catch(e){refs=0;dbg.cnt="error: "+(e&&e.code||e&&e.message||e)}
    if(myUname && S.username!==myUname){try{await store.patch({username:myUname});S.username=myUname}catch(e){}}
    await loadCfg();
    try{const w=await store.lbwGet(wkNum()); W={wk:wkNum(),catcher:(w&&w.catcher)||0,scam:(w&&w.scam)||0}}catch(e){W={wk:wkNum(),catcher:0,scam:0}}
    try{CUSTOM=(await store.getTasks(myUname)).filter(d=>d&&d.title&&d.url&&/^https?:\/\//.test(d.url)).map(d=>({id:"c_"+d.id,icon:String(d.icon||"⭐").slice(0,4),title:String(d.title).slice(0,80),reward:Math.min(100,Math.max(0,Number(d.reward)||0)),url:d.url,at:d.createdAt||0})).sort((a,b)=>a.at-b.at)}catch(e){console.warn("tasks",e)}
    $("#nav").hidden=false; render(); lbSoon();
    try{const g=S.lastGift; if(g&&g.at){const k="edoge_gift_"+myTgId; const seen=Number(localStorage.getItem(k)||0); if(g.at>seen){localStorage.setItem(k,String(g.at)); setTimeout(()=>toast("🎁 +"+g.coins+" coins from the team"+(g.note?": "+String(g.note).slice(0,60):"")),700)}}}catch(e){}
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S){loadCfg().then(()=>{render()})}});
    tick=setInterval(paintClaim,1000);
    window.__app={S:()=>S,mode:()=>mode,cfg:o=>{Object.assign(CFG,o);render()},game:()=>G,setX:v=>{gx=v},tasks:l=>{CUSTOM=l;render()}};
  }catch(e){
    console.error(e);
    $("#main").innerHTML='<div class="card"><b>Could not start.</b><p class="note" style="color:#000">Please close and open the app again.</p></div>';
  }
})();
</script>
