/* Levels and XP: XP is cosmetic (no coins) */
const lvlOf=xp=>Math.floor(Math.sqrt(Math.max(0,xp)/25))+1;
const xpFor=l=>25*(l-1)*(l-1);
const lvlTitle=l=>l<3?"Pup 🐶":l<6?"Shiba 🐕":l<10?"Alpha 🦮":"Legend 👑";
const streakNow=()=>{const d=dayNum();return (S.streakDay===d||S.streakDay===d-1)?(S.streak||0):0};
let xpSrv=0, xpTimer=null, streakWant=false;
function xpAdd(n){
  const before=lvlOf(S.xp||0); S.xp=(S.xp||0)+n;
  if(lvlOf(S.xp)>before){toast("⬆️ Level up! "+lvlTitle(lvlOf(S.xp))+" Lv "+lvlOf(S.xp));confetti();sfx("win")}
  clearTimeout(xpTimer); xpTimer=setTimeout(xpFlush,1500);
}
function questState(){const d=dayNum();return [
  {t:"Claim your daily coins",ok:Math.floor((S.lastClaim||0)/86400000)===d},
  {t:"Play a game",ok:(S.gameDay===d&&S.gamePlays>0)||(S.spinDay===d&&S.spinsUsed>0)},
  {t:"Take care of your Doge pet",ok:S.petDay===d&&S.petActs>0}]}
async function xpFlush(){
  if(!S||!store) return;
  try{
    const d=dayNum(), patch={};
    if(streakWant&&S.streakDay!==d){patch.streakDay=d;patch.streak=(S.streakDay===d-1?(S.streak||0)+1:1)}
    if(S.questDay!==d&&questState().every(q=>q.ok)){patch.questDay=d;S.xp=(S.xp||0)+20;toast("✅ Daily quests done! +20 XP")}
    const target=S.xp||0; if(target>xpSrv||Object.keys(patch).length){
      const step=Math.min(150,target-xpSrv); patch.xp=xpSrv+Math.max(0,step);
      await store.patch(patch); xpSrv=patch.xp; Object.assign(S,patch,{xp:target});
      if(target>xpSrv){xpTimer=setTimeout(xpFlush,300)}
    }
  }catch(e){console.warn("xp",e&&e.code||e)}
}

/* ---------- Lucky Spin ---------- */
function drawWheel(a){
  const c=$("#wheel"); if(!c) return; const x=c.getContext("2d"), R=260, n=PRIZES.length, seg=Math.PI*2/n;
  const cols=["#ffc62e","#ff5c9d","#58d6ff","#5ef2b0","#fff6e0","#ff9f43"];
  x.clearRect(0,0,520,520); x.save(); x.translate(R,R); x.rotate(a);
  for(let i=0;i<n;i++){
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,R-8,i*seg,(i+1)*seg); x.closePath();
    x.fillStyle=cols[i%cols.length]; x.fill(); x.lineWidth=6; x.strokeStyle="#000"; x.stroke();
    x.save(); x.rotate((i+.5)*seg); x.fillStyle="#000"; x.font="900 46px Arial Black,Arial,sans-serif"; x.textAlign="right"; x.fillText("+"+Math.min(PRIZES[i].v,CFG.spinMax),R-42,16); x.restore();
  }
  x.beginPath(); x.arc(0,0,36,0,Math.PI*2); x.fillStyle="#000"; x.fill(); x.restore();
}
async function doSpin(){
  if(spinning||gameRun||petBusy) return;
  await refreshS();
  await loadCfg(); if(!CFG.appOn||!CFG.gamesOn||!CFG.spinOn) return toast("Lucky Spin is paused for now");
  if(spinsLeft()<=0) return toast("No spins left today. Come back tomorrow!");
  let r=Math.random()*PRIZES.reduce((a,p)=>a+p.w,0), idx=0;
  for(let i=0;i<PRIZES.length;i++){r-=PRIZES[i].w; if(r<=0){idx=i;break}}
  const prize={v:Math.min(PRIZES[idx].v,CFG.spinMax)}, day=dayNum(), used=(S.spinDay===day?(S.spinsUsed||0):0)+1, coins=round1((S.coins||0)+prize.v);
  try{await store.patch({coins,spinDay:day,spinsUsed:used})}catch(e){console.error(e);return toast("Could not save. Check your internet.")}
  S.coins=coins; S.spinDay=day; S.spinsUsed=used; spinning=true;
  const b=$("#spin"); if(b) b.disabled=true;
  const seg=Math.PI*2/PRIZES.length, jitter=(Math.random()-.5)*seg*.6;
  const target=-Math.PI/2-(idx+.5)*seg+jitter, a0=wheelAngle;
  const delta=(((target-a0)%(Math.PI*2))+Math.PI*2)%(Math.PI*2), total=Math.PI*2*5+delta, T=4000, t0=performance.now();
  await new Promise(res=>{(function f(now){
    const p=Math.min(1,(now-t0)/T), e=1-Math.pow(1-p,3);
    wheelAngle=a0+total*e; drawWheel(wheelAngle);
    if(p<1) requestAnimationFrame(f); else res();
  })(t0)});
  wheelAngle=((wheelAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  spinning=false; setCoins();
  const l=$("#spinsLeft"); if(l) l.textContent=spinsLeft();
  const bb=$("#spin"); if(bb) bb.disabled=spinsLeft()<=0;
  buzz(); toast("🎉 +"+prize.v+" coins!"); xpAdd(3);
  if(pendingRender){pendingRender=false;render();switchTab("games")}
}

const GW=340, GH=460, DOGE_Y=GH-54;
function gctx(){const c=$("#gc");return c?c.getContext("2d"):null}
function drawIdle(){

}
let inputOn=null;
function attachGameInput(){
  const c=$("#gc"); if(!c||inputOn===c) return; inputOn=c;
  const mv=e=>{if(!gameRun)return;const r=c.getBoundingClientRect();gx=Math.max(24,Math.min(GW-24,(e.clientX-r.left)/r.width*GW));e.preventDefault()};
  c.addEventListener("pointerdown",e=>{try{c.setPointerCapture(e.pointerId)}catch(_){}mv(e)});

async function startGame(){
  if(gameRun||spinning||petBusy) return;
  await refreshS();
  await loadCfg(); if(!CFG.appOn||!CFG.gamesOn||!CFG.catcherOn) return toast("Catcher is paused for now");
  if(playsLeft()<=0) return toast("No plays left today. Come back tomorrow!");
  const day=dayNum(), same=S.gameDay===day;
  const patch={gameDay:day,gamePlays:(same?(S.gamePlays||0):0)+1,gameCoins:same?(S.gameCoins||0):0};
  try{await store.patch(patch)}catch(e){console.error(e);return toast("Could not start. Check your internet.")}
  Object.assign(S,patch);
  const pl=$("#playsLeft"); if(pl) pl.textContent=playsLeft();
  const b=$("#gstart"); if(b) b.disabled=true;
  try{tg&&tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
  gx=GW/2; gameRun=true;
  G={t:0,score:0,items:[],nextCoin:.6,nextBomb:1.4,over:false,why:"",last:performance.now()};
  requestAnimationFrame(gameFrame);
}
const KINDS=[{v:.2,sp:.8,r:13,c:"#fff6e0",w:50},{v:.5,sp:1,r:15,c:"#ffc62e",w:35},{v:1,sp:1.4,r:17,c:"#ff9f43",w:15}];
function gameFrame(now){
  if(!G) return;
  const dt=Math.min(.05,(now-G.last)/1000); G.last=now; G.t+=dt;
  const base=210+G.t*5.4;                                   // fall speed keeps rising, no levels
  // one coin about every 2.2 seconds; the round ends after 60 seconds
  if(G.t>=G.nextCoin){
    let r=Math.random()*100,k=KINDS[0]; for(const q of KINDS){r-=q.w;if(r<=0){k=q;break}}
    G.items.push({type:"coin",v:k.v,r:k.r,c:k.c,x:24+Math.random()*(GW-48),y:-20,sp:k.sp});
    G.nextCoin=G.t+2.2*(.85+Math.random()*.3);
  }
  if(G.t>=G.nextBomb){
    G.items.push({type:"bomb",r:15,x:20+Math.random()*(GW-40),y:-20,sp:1.05});
    G.nextBomb=G.t+Math.max(.55,1.6-G.t*.0175)*(.8+Math.random()*.4);
  }
  if(G.t>=GAME_SECS){G.over=true;G.why="time"}
  let ended=false;
  for(const it of G.items){
    it.y+=base*it.sp*dt;
    if(!it.dead && Math.abs(it.y-DOGE_Y)<it.r+20 && Math.abs(it.x-gx)<it.r+26){
      it.dead=true;
      if(it.type==="bomb"){G.over=true;G.why="bomb";ended=true}
      else{G.score=round1(G.score+it.v)}
    } else if(it.y>GH+50){ it.dead=true; }
  }
  G.items=G.items.filter(i=>!i.dead);
  drawGame();
  if(ended||G.over) return endGame();
  requestAnimationFrame(gameFrame);
}
function drawGame(){
  const x=gctx(); if(!x||!G) return;
  x.clearRect(0,0,GW,GH); x.fillStyle="#221a45"; x.fillRect(0,0,GW,GH);
  x.textAlign="center"; x.textBaseline="middle";
  for(const it of G.items){
    if(it.type==="bomb"){x.font="30px serif";x.fillText("💣",it.x,it.y);continue}
    x.beginPath(); x.arc(it.x,it.y,it.r,0,Math.PI*2); x.fillStyle=it.type==="big"?"#ff5c9d":it.c; x.fill(); x.lineWidth=3; x.strokeStyle="#000"; x.stroke();
    x.fillStyle="#000"; x.font=it.type==="big"?"900 16px Arial Black,Arial":"900 12px Arial Black,Arial"; x.fillText(it.type==="big"?"EDOGE":String(it.v),it.x,it.y-(it.type==="big"?7:0));
    if(it.type==="big"){x.font="900 17px Arial Black,Arial";x.fillText(String(it.v),it.x,it.y+11)}
  }
  x.font="46px serif"; x.fillText("🐕",gx,DOGE_Y+6);
  x.textAlign="left"; x.textBaseline="alphabetic"; x.fillStyle="#fff6e0"; x.font="900 18px Arial Black,Arial"; x.fillText("🪙 "+G.score,12,26);
  x.textAlign="right"; const ts=Math.max(0,Math.ceil(GAME_SECS-G.t)); x.fillText("⏱ 0:"+String(ts).padStart(2,"0"),GW-12,26);
}

async function applyCode(){
  const v=($("#code").value||"").trim().replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
  if(!v) return toast("Enter a code first");
  if(v===myTgId) return toast("You cannot use your own code");
  try{
    try{await store.addRef(v)}catch(e){console.warn("addRef (maybe already saved)",e)}
    await store.patch({referredBy:v});
    S.referredBy=v; dbg.ref="saved (typed code)"; buzz(); toast("Invite code applied");
  }catch(e){
    console.error(e); dbg.ref="error: "+(e&&e.code||e&&e.message||e);
    toast("Could not apply: "+(e&&e.code||"error"));
  }
  render(); switchTab("friends");
}
async function copyLink(){
  const l=inviteLink();
  try{await navigator.clipboard.writeText(l);toast("Link copied")}catch(e){const i=$("#link");i.select();try{document.execCommand("copy");toast("Link copied")}catch(_){toast("Press and hold the link to copy")}}
}
async function saveWallet(){
  const v=$("#wallet").value.trim();
  if(!/^0x[a-fA-F0-9]{40}$/.test(v)) return toast("Enter a valid address: 0x + 40 characters");
  try{await store.patch({wallet:v});S.wallet=v;buzz();toast("Wallet saved")}catch(e){toast("Could not save. Check your internet.")}
}
function switchTab(t){
  if(t==="lb"&&$("#lblist")) loadLb();
  document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id==="t-"+t));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.t));

/* ---------- start ---------- */
(async()=>{
  try{
    store=await makeStore();
    S=await store.load();
    if(!S){
      const ref=(startParam&&startParam!==myTgId)?startParam:"";
      S={tgId:myTgId,name:myName,username:myUname,coins:WELCOME_BONUS,lastClaim:0,tasks:{},wallet:"",referredBy:ref,createdAt:Date.now()};
      await store.create(S);
      if(ref){try{await store.addRef(ref);dbg.ref="saved"}catch(e){console.warn("ref failed",e);dbg.ref="error: "+(e&&e.code||e&&e.message||e)}}
    }
    // Existing account that never used an invite, opened via someone's link within its first 7 days: apply it now.
    if(S && !S.referredBy && startParam && startParam!==myTgId && (Date.now()-(S.createdAt||0))<7*24*3600*1000){
      try{
        try{await store.addRef(startParam)}catch(e){console.warn("late addRef",e)}
        await store.patch({referredBy:startParam}); S.referredBy=startParam; dbg.ref="saved (late, from link)";
      }catch(e){dbg.ref="error (late): "+(e&&e.code||e&&e.message||e)}
    }
    try{refs=await store.refCount();dbg.cnt="ok, "+refs}catch(e){refs=0;dbg.cnt="error: "+(e&&e.code||e&&e.message||e)}
    if(myUname && S.username!==myUname){try{await store.patch({username:myUname});S.username=myUname}catch(e){}}
    xpSrv=S.xp||0; await loadCfg();
    try{const w=await store.lbwGet(wkNum()); W={wk:wkNum(),catcher:(w&&w.catcher)||0,pet:(w&&w.pet)||0}}catch(e){W={wk:wkNum(),catcher:0,pet:0}}
    try{CUSTOM=(await store.getTasks(myUname)).filter(d=>d&&d.title&&d.url&&/^https?:\/\//.test(d.url)).map(d=>({id:"c_"+d.id,icon:String(d.icon||"⭐").slice(0,4),title:String(d.title).slice(0,80),reward:Math.min(100,Math.max(0,Number(d.reward)||0)),url:d.url,at:d.createdAt||0})).sort((a,b)=>a.at-b.at)}catch(e){console.warn("tasks",e)}
    $("#nav").hidden=false; render(); lbSoon();
    try{const g=S.lastGift; if(g&&g.at){const k="edoge_gift_"+myTgId; const seen=Number(localStorage.getItem(k)||0); if(g.at>seen){localStorage.setItem(k,String(g.at)); setTimeout(()=>toast("🎁 +"+g.coins+" coins from the team"+(g.note?": "+String(g.note).slice(0,60):"")),700)}}}catch(e){}
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S){loadCfg().then(()=>{render()})}});
    tick=setInterval(()=>{paintClaim();paintPet()},1000);
    window.__app={S:()=>S,mode:()=>mode,cfg:o=>{Object.assign(CFG,o);render()},game:()=>G,setX:v=>{gx=v},tasks:l=>{CUSTOM=l;render()}};
  }catch(e){
    console.error(e);
    $("#main").innerHTML='<div class="card"><b>Could not start.</b><p class="note" style="color:#000">Please close and open the app again.</p></div>';
  }
})();
</script>
